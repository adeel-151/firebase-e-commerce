<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lumière</title>
    <!-- Fonts (Locally Imported via style.css) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="brand-beige-bg text-brand-dark font-sans">
    <nav class="position-absolute w-100 top-0 z-3 py-4 bg-transparent">
        <div class="container-fluid px-4 px-md-5 max-w-1600 d-flex justify-content-between align-items-center">
            <a href="../index.html" class="text-decoration-none fs-3 font-serif tracking-widest text-uppercase text-brand-dark">Lumière.</a>
        </div>
    </nav>

    <main class="w-100 vh-100 d-flex align-items-center justify-content-center brand-beige-bg pt-5">
        <div class="bg-white p-5 p-md-5 w-100 shadow border border-light mt-5" style="max-width: 450px;">
            <div class="text-center mb-5">
                <h2 class="fs-2 font-serif text-brand-dark mb-2">Create an Account</h2>
                <p class="text-muted fw-light">Join us and elevate your everyday.</p>
            </div>
            
            <form id="signupForm" class="d-flex flex-column gap-4">
                <div>
                    <label for="name" class="form-label small fw-bold text-uppercase tracking-widest text-brand-dark mb-2">Full Name</label>
                    <input type="text" id="name" class="form-control form-control-lg bg-transparent border-0 border-bottom border-secondary rounded-0 shadow-none fs-6 custom-input" required placeholder="John Doe">
                </div>
                <div>
                    <label for="email" class="form-label small fw-bold text-uppercase tracking-widest text-brand-dark mb-2 mt-2">Email Address</label>
                    <input type="email" id="email" class="form-control form-control-lg bg-transparent border-0 border-bottom border-secondary rounded-0 shadow-none fs-6 custom-input" required placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="form-label small fw-bold text-uppercase tracking-widest text-brand-dark mb-2 mt-2">Password</label>
                    <input type="password" id="password" class="form-control form-control-lg bg-transparent border-0 border-bottom border-secondary rounded-0 shadow-none fs-6 custom-input" required placeholder="••••••••" minlength="6">
                </div>
                
                <div id="authError" class="text-danger small d-none mt-2"></div>
                
                <button type="submit" class="btn btn-dark w-100 py-3 rounded-0 tracking-widest text-uppercase fw-bold btn-custom-checkout mt-4" id="signupBtn">
                    Create Account
                </button>
            </form>
            
            <div class="mt-5 text-center small text-muted fw-light">
                Already have an account? <a href="login.html" class="text-brand-dark fw-bold text-decoration-none hover-gold transition-colors">Sign In</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth/signup.js"></script>
</body>
</html>
