<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Lumière Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">Lumière Admin</div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="products.html" class="active"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a>
                <div class="admin-nav-divider"></div>
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Store</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="#" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Product Management</h2>
                <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus me-2"></i>Add Product</button>
            </header>

            <div class="admin-content">
                <!-- Stats Row -->
                <div class="row g-4 mb-4">
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon gold"><i class="fas fa-box"></i></div>
                            <div class="stat-info">
                                <h3>All Products</h3>
                                <div class="stat-value" id="prodCountAll">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon blue"><i class="fas fa-tags"></i></div>
                            <div class="stat-info">
                                <h3>Categories</h3>
                                <div class="stat-value" id="prodCountCategories">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="data-table-container">
                    <div class="data-table-header">
                        <h3>All Products</h3>
                        <div class="search-bar" style="width: 280px;">
                            <i class="fas fa-search" style="color: #a0aab2; font-size: 14px;"></i>
                            <input type="text" id="productSearch" placeholder="Search products...">
                        </div>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <tr><td colspan="5" class="text-center" style="padding: 40px;">Loading products...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal (Create/Edit) -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Product</h3>
                <button class="btn-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="title">Product Title</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. Royal Silk Kurta" required>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label for="price">Price (Rs.)</label>
                                <input type="number" id="price" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" class="form-control" required>
                                    <option value="">Select Category</option>
                                    <option value="Apparel">Apparel</option>
                                    <option value="Fragrances">Fragrances</option>
                                    <option value="Footwear">Footwear</option>
                                    <option value="Cosmetics">Cosmetics</option>
                                    <option value="Accessories">Accessories</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input type="url" id="image" class="form-control" placeholder="https://images.unsplash.com/..." required>
                        <div style="margin-top: 10px;">
                            <img id="imagePreview" src="" alt="Preview" style="max-width: 120px; max-height: 120px; display: none; border-radius: 8px; border: 1px solid #e9ecef;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" rows="4" placeholder="Describe this product..." required></textarea>
                    </div>
                    <div id="productFormError" class="error-message"></div>
                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e9ecef;">
                        <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveProductBtn"><i class="fas fa-save me-2"></i>Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/admin/products.js"></script>
</body>
</html>
