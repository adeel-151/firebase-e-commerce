<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Lumière Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">Lumière Admin</div>
            <nav class="admin-nav">
                <a href="index.html" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a>
                <div class="admin-nav-divider"></div>
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Store</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="#" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Dashboard Overview</h2>
                <div class="d-flex align-items-center gap-3">
                    <span id="adminEmail" class="text-muted small fw-bold" style="letter-spacing: 0.05em;"></span>
                    <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
                </div>
            </header>

            <div class="admin-content">
                <!-- Stat Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon gold"><i class="fas fa-box"></i></div>
                            <div class="stat-info">
                                <h3>Total Products</h3>
                                <div class="stat-value" id="totalProducts">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon blue"><i class="fas fa-shopping-bag"></i></div>
                            <div class="stat-info">
                                <h3>Total Orders</h3>
                                <div class="stat-value" id="totalOrders">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon green"><i class="fas fa-dollar-sign"></i></div>
                            <div class="stat-info">
                                <h3>Total Revenue</h3>
                                <div class="stat-value" id="totalSales">Rs. 0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon purple"><i class="fas fa-users"></i></div>
                            <div class="stat-info">
                                <h3>Categories</h3>
                                <div class="stat-value" id="totalCategories">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="mb-4">
                    <h3 style="font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 16px; color: #1a1a1a;">Quick Actions</h3>
                    <div class="quick-actions">
                        <a href="products.html" class="quick-action-card">
                            <i class="fas fa-plus-circle"></i>
                            <span>Add Product</span>
                        </a>
                        <a href="orders.html" class="quick-action-card">
                            <i class="fas fa-clipboard-list"></i>
                            <span>Manage Orders</span>
                        </a>
                        <a href="../shop.html" target="_blank" class="quick-action-card">
                            <i class="fas fa-store"></i>
                            <span>View Shop</span>
                        </a>
                        <a href="../index.html" target="_blank" class="quick-action-card">
                            <i class="fas fa-home"></i>
                            <span>View Homepage</span>
                        </a>
                    </div>
                </div>

                <!-- Recent Orders Table -->
                <div class="data-table-container">
                    <div class="data-table-header">
                        <h3>Recent Orders</h3>
                        <a href="orders.html" class="btn btn-outline btn-sm">View All <i class="fas fa-arrow-right ms-1"></i></a>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersBody">
                            <tr><td colspan="5" class="text-center" style="padding: 40px;">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/admin/dashboard.js"></script>
</body>
</html>
