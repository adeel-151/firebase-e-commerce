<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Lumière</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="brand-beige-bg font-sans">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <aside class="bg-brand-dark text-white p-4" style="width: 250px; flex-shrink: 0;">
            <div class="fs-4 font-serif text-brand-gold tracking-widest text-uppercase mb-5 border-bottom border-secondary pb-3">
                Lumière Admin
            </div>
            <nav class="d-flex flex-column gap-3">
                <a href="index.html" class="text-white text-decoration-none bg-secondary bg-opacity-25 p-3 rounded fw-bold"><i class="fas fa-home me-2"></i> Dashboard</a>
                <a href="products.html" class="text-white-50 text-decoration-none p-3 hover-white transition-colors"><i class="fas fa-box me-2"></i> Products</a>
                <a href="orders.html" class="text-white-50 text-decoration-none p-3 hover-white transition-colors"><i class="fas fa-shopping-cart me-2"></i> Orders</a>
                <a href="../index.html" target="_blank" class="text-white-50 text-decoration-none p-3 hover-white transition-colors"><i class="fas fa-external-link-alt me-2"></i> View Store</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4 p-md-5">
            <header class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-light">
                <h2 class="fs-3 font-serif text-brand-dark mb-0">Dashboard Overview</h2>
                <div class="d-flex align-items-center gap-4">
                    <span id="adminEmail" class="text-muted small fw-bold tracking-wider">admin@lumiere.com</span>
                    <button id="logoutBtn" class="btn btn-outline-dark btn-sm rounded-0 tracking-widest text-uppercase">Logout</button>
                </div>
            </header>

            <div class="container-fluid p-0">
                <!-- Stat Cards -->
                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="bg-white p-4 shadow-sm border border-light h-100 d-flex align-items-center gap-4">
                            <div class="bg-brand-beige text-brand-gold p-3 rounded-circle fs-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                                <i class="fas fa-box"></i>
                            </div>
                            <div>
                                <h3 class="fs-6 text-uppercase tracking-widest text-muted mb-1">Total Products</h3>
                                <div class="fs-2 font-serif text-brand-dark fw-bold" id="totalProducts">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="bg-white p-4 shadow-sm border border-light h-100 d-flex align-items-center gap-4">
                            <div class="bg-brand-beige text-brand-gold p-3 rounded-circle fs-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                                <i class="fas fa-shopping-cart"></i>
                            </div>
                            <div>
                                <h3 class="fs-6 text-uppercase tracking-widest text-muted mb-1">Total Orders</h3>
                                <div class="fs-2 font-serif text-brand-dark fw-bold" id="totalOrders">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="bg-white p-4 shadow-sm border border-light h-100 d-flex align-items-center gap-4">
                            <div class="bg-brand-beige text-brand-gold p-3 rounded-circle fs-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                            <div>
                                <h3 class="fs-6 text-uppercase tracking-widest text-muted mb-1">Total Sales</h3>
                                <div class="fs-2 font-serif text-brand-dark fw-bold" id="totalSales">$0.00</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders Preview -->
                <div class="bg-white shadow-sm border border-light p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fs-5 font-serif text-brand-dark mb-0">Recent Orders</h3>
                        <a href="orders.html" class="btn btn-dark btn-sm rounded-0 tracking-widest text-uppercase">View All</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-uppercase tracking-widest small text-muted">Order ID</th>
                                    <th class="text-uppercase tracking-widest small text-muted">Date</th>
                                    <th class="text-uppercase tracking-widest small text-muted">Customer</th>
                                    <th class="text-uppercase tracking-widest small text-muted">Total</th>
                                    <th class="text-uppercase tracking-widest small text-muted">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersBody">
                                <tr><td colspan="5" class="text-center py-4 text-muted">Loading orders...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/admin/dashboard.js"></script>
</body>
</html>
