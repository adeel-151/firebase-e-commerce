<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Lumière Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">Lumière Admin</div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-shopping-bag"></i> Orders</a>
                <a href="categories.html"><i class="fas fa-tags"></i> Categories</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
                <div class="admin-nav-divider"></div>
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Store</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="#" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
            </div>
        </aside><div class="admin-sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header"><button class="admin-mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                <h2>Order Management</h2>
                <div class="d-flex align-items-center gap-3">
                    <select id="statusFilter" class="form-control" style="width: 180px; padding: 8px 14px; border: 1px solid #e9ecef; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif;">
                        <option value="all">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </header>

            <div class="admin-content">
                <!-- Stats Row -->
                <div class="row g-4 mb-4">
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon gold"><i class="fas fa-shopping-bag"></i></div>
                            <div class="stat-info">
                                <h3>All Orders</h3>
                                <div class="stat-value" id="orderCountAll">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon blue"><i class="fas fa-clock"></i></div>
                            <div class="stat-info">
                                <h3>Pending</h3>
                                <div class="stat-value" id="orderCountPending">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon purple"><i class="fas fa-truck"></i></div>
                            <div class="stat-info">
                                <h3>Shipped</h3>
                                <div class="stat-value" id="orderCountShipped">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                            <div class="stat-info">
                                <h3>Delivered</h3>
                                <div class="stat-value" id="orderCountDelivered">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="data-table-container">
                    <div class="data-table-header">
                        <h3>All Orders</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="7" class="text-center" style="padding: 40px;">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Order Details <small id="modalOrderId" style="font-size: 13px; color: #a0aab2;"></small></h3>
                <button class="btn-close" id="closeOrderModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                    <div>
                        <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aab2; font-weight: 600; margin-bottom: 4px;">Customer</div>
                        <div id="modalCustomerEmail" style="font-weight: 500; font-size: 14px;"></div>
                    </div>
                    <div>
                        <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aab2; font-weight: 600; margin-bottom: 4px;">Date</div>
                        <div id="modalOrderDate" style="font-weight: 500; font-size: 14px;"></div>
                    </div>
                    <div>
                        <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aab2; font-weight: 600; margin-bottom: 4px;">Total</div>
                        <div id="modalOrderTotal" style="font-weight: 700; font-size: 18px; color: #1a1a1a;"></div>
                    </div>
                    <div>
                        <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aab2; font-weight: 600; margin-bottom: 4px;">Update Status</div>
                        <select id="updateOrderStatus" class="form-control" style="padding: 8px 12px; border: 1px solid #e9ecef; border-radius: 8px; font-size: 14px;">
                            <option value="Pending">Pending</option>
                            <option value="Processing">Processing</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div style="border-top: 1px solid #e9ecef; padding-top: 20px;">
                    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aab2; font-weight: 600; margin-bottom: 12px;">Order Items</div>
                    <ul id="modalOrderItems" style="list-style: none; padding: 0; margin: 0;"></ul>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e9ecef;">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('orderModal').classList.remove('active')">Close</button>
                    <button type="button" class="btn btn-primary" id="saveOrderStatusBtn"><i class="fas fa-save me-2"></i>Update Status</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // TODO: Initialize with your EmailJS public key
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/admin/orders.js"></script>
    <script>
    const mobileToggle = document.getElementById('mobileToggle');
    const sidebar = document.querySelector('.admin-sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    if (mobileToggle) {
        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });
    }
    if (overlay) {
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });
    }
    </script></body>
</html>
