<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                Lumière Admin
            </div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Store</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Order Management</h2>
            </header>

            <div class="admin-content">
                <div class="data-table-container">
                    <div class="data-table-header">
                        <h3>All Orders</h3>
                        <div class="filters">
                            <select id="statusFilter" class="filter-select">
                                <option value="all">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                            </select>
                        </div>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Customer Email</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="7" class="text-center">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Details Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Order Details <span id="modalOrderId" style="font-size:14px; color:#777; font-weight:normal;"></span></h3>
                <button class="btn-close" id="closeOrderModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <strong>Customer Info:</strong>
                        <p id="modalCustomerEmail"></p>
                    </div>
                    <div>
                        <strong>Order Date:</strong>
                        <p id="modalOrderDate"></p>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Update Status:</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="updateOrderStatus" class="form-control" style="width: auto;">
                            <option value="Pending">Pending</option>
                            <option value="Processing">Processing</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Delivered">Delivered</option>
                        </select>
                        <button class="btn btn-primary" id="saveOrderStatusBtn">Update</button>
                    </div>
                </div>

                <h4 style="margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Items</h4>
                <ul id="modalOrderItems" style="list-style: none; padding: 0;">
                    <!-- Injected by JS -->
                </ul>
                
                <div style="text-align: right; margin-top: 20px; font-size: 18px;">
                    <strong>Total: <span id="modalOrderTotal" style="color: var(--accent-color);">$0.00</span></strong>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/admin/orders.js"></script>
</body>
</html>
